[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=61" ]

[project]
name = "anemoi-docs"
version = "0.0.1"
description = "The documentation for anemoi"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "nbsphinx",
  "pandoc",
  "pre-commit",
  "requests",
  "sphinx",
  "sphinx-argparse<0.5",
  "sphinx-rtd-theme",
]

[tool.ruff]
line-length = 120
extend-exclude = [ "docs/**/*_.py" ]
lint.select = [ "E4", "E7", "E9", "F", "I" ]
lint.isort.force-single-line = true
lint.isort.known-first-party = [ "anemoi" ]

[tool.pyproject-fmt]
generate_python_version_classifiers = false

[tool.docsig]
check-class = true
check-dunders = true
check-overridden = true
check-protected = true
ignore-no-params = true
disable = [ "SIG101", "SIG102", "SIG305", "SIG306", "SIG502", "SIG505" ]
